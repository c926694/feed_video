brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# Proxy、mqadmin 与客户端都在 compose 网络内用服务名访问 Broker，
# 宿主机只发布 gRPC 端口
brokerIP1=broker
listenPort=10911

deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 按发送请求自动创建 topic 与订阅组
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# 视频事件的 payload 都是几百字节，默认 4MB 足够
maxMessageSize=4194304
