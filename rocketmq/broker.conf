brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# 客户端与 Proxy 都通过这个地址访问 Broker，填宿主机的对外地址
brokerIP1=192.168.145.101
listenPort=10911
haListenPort=10912

deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 允许按发送请求自动创建 topic 与订阅组，行为与之前使用 Kafka 时一致
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# 视频事件的 payload 都是几百字节，默认 4MB 足够
maxMessageSize=4194304
