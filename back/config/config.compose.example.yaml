  port: 6380
  password: ""
  db: 0

kafka:
  brokers:
    - kafka:9092
  group_id: feed_video

jwt:
  secret: "a9f3kLm92Jd8sKqP0xZr7Tn4WbC6Yh1V"
  expire_hours: 72

upload:
  avatar_dir: avatar
