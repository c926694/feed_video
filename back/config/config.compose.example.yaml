# docker compose 部署用的配置示例。
# 用法：
#   1. cp back/config/config.compose.example.yaml back/config/config.yaml
#   2. 填好下面标「必填」的项
#   3. docker compose up -d
# compose 会把这份文件只读挂载到容器的 /app/config/config.yaml，配置不进镜像。
# 容器之间一律用服务名互访（mysql / redis / kafka / backend），不要写 IP，IP 会随容器重建变化。

server:
  port: 8081
  # 容器里跑用 release，关掉调试输出
  mode: release
  # 只有前端 dev server 直连后端（跨域）时才需要这条；走 nginx 反代是同源，不受影响
  allow_origins:
    - http://localhost:*
    - http://127.0.0.1:*

mysql:
  # 服务名，compose 内部 DNS
  host: mysql
  port: 3307
  username: root
  # 必填：与 docker-compose.yml 里 mysql 服务的 MYSQL_ROOT_PASSWORD 保持一致
  password: "1234"
  dbname: feed_video
  charset: utf8mb4

redis:
  # 服务名
  host: redis
  port: 6380
  password: ""
  db: 0

kafka:
  # 服务名。客户端先用它建连拿到元数据，之后按 broker 通告的地址再连一次，
  # compose 里给容器通告的正是 kafka:9092
  brokers:
    - kafka:9092
  group_id: feed_video

jwt:
  # 必填：换成自己的随机串，泄露等于任何人都能签出合法令牌
  secret: "change-me-to-a-random-string"
  # access token 有效期（分钟），也是登出之后旧令牌还能用的最长时间
  access_token_minutes: 15
  # refresh token 有效期（小时），336 小时等于 14 天
  refresh_token_hours: 336

upload:
  # OSS 里的三个目录前缀，保持默认即可
  avatar_dir: avatar
  cover_dir: cover
  video_dir: video
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    # 必填二选一：这里直接填，或者留空，由环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 注入
    access_key_id: ""
    access_key_secret: ""
    # 必填：你自己的 bucket 名
    bucket: feed-cp
    prefix: ""
    custom_domain: ""

# 前端直传 OSS 用的 STS 临时凭证，四项缺任意一项，上传凭证接口都会返回「直传服务未配置」
ram:
  # 必填：地域 ID，例如 cn-beijing
  region_id: ""
  # 必填：被扮演的角色 ARN，例如 acs:ram::1234567890:role/your-role
  role_arn: ""
  # 必填二选一：这里直接填，或者留空，由环境变量 RAM_ACCESS_KEY_ID / RAM_ACCESS_KEY_SECRET 注入。
  # 这个子账号只需要 AssumeRole 权限，不要授予 OSS 的长期权限
  access_key_id: ""
  access_key_secret: ""
  # 扮演角色时带的会话名，保持默认即可
  role_session_name: feed-video
