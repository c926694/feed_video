# 一键起整套服务：
#   1. cp back/config/config.compose.example.yaml back/config/config.yaml
#   2. 填好 config.yaml 里标「必填」的项（数据库密码、JWT 密钥、OSS 与 RAM 凭据）
#   3. docker compose up -d
# 代码改动之后要重新构建镜像：docker compose up -d --build
#
# 容器之间用服务名互访（mysql / redis / kafka / backend），不要写 IP。

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    # 容器内端口固定 3307，与后端配置保持一致；映射到宿主机方便用本地客户端连
    command:
      - --port=3307
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # 与 back/config/config.yaml 里的 mysql.password 保持一致
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: feed_video
      TZ: Asia/Shanghai
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -p1234 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 两个监听器：INTERNAL 给容器之间用，通告 kafka:9092；
      # EXTERNAL 给宿主机上的命令行工具用，通告地址由 KAFKA_EXTERNAL_HOST 控制
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: Asia/Shanghai
    ports:
      # 9092 给容器网络外的客户端连；宿主机工具请用 19092 这个外部监听器
      - "9092:9092"
      - "19092:19092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 凭据除了写在 config.yaml 里，也可以在这里注入：配置里留空时用它兜底
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      RAM_ACCESS_KEY_ID: ${RAM_ACCESS_KEY_ID:-}
      RAM_ACCESS_KEY_SECRET: ${RAM_ACCESS_KEY_SECRET:-}
    ports:
      - "8081:8081"
    volumes:
      # 配置的唯一来源：宿主机上的这一份，只读挂载，不进镜像
      - ./back/config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # /healthz 是不需要鉴权的存活探测接口
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "81:81"
    depends_on:
      # 等后端真的能提供服务再起 nginx，避免刚启动那几秒 502
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  kafka_data:
