# 一键起整套服务：
#   1. cp back/config/config.compose.example.yaml back/config/config.yaml
#   2. 填好 config.yaml 里标「必填」的项（数据库密码、JWT 密钥、OSS 与 RAM 凭据）
#   3. docker compose up -d
#   4. docker exec feed-broker bash /home/rocketmq/init-topics.sh（建 topic 与消费组，只做一次）
# 代码改动之后要重新构建镜像：docker compose up -d --build
#
# 容器之间用服务名互访（mysql / redis / broker / backend），不要写 IP。
# 容器名统一是 feed- 前缀，由各服务的 container_name 指定。

services:
  mysql:
    image: mysql:8.0.36
    container_name: feed-mysql
    restart: unless-stopped
    # 容器内端口固定 3307，与后端配置保持一致；映射到宿主机方便用本地客户端连
    command:
      - --port=3307
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # 与 back/config/config.yaml 里的 mysql.password 保持一致
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: feed_video
      TZ: Asia/Shanghai
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -p1234 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: feed-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: feed-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
      # 启动脚本用 HEAP_OPTS 覆盖默认堆，默认值是 1g，小内存机器必须压下来
      HEAP_OPTS: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "9876:9876"

  broker:
    image: apache/rocketmq:5.3.2
    container_name: feed-broker
    restart: unless-stopped
    # ProxyStartup 的 local 模式：Broker 与 Proxy 在同一个进程里，只对外发布 gRPC 端口
    command: sh mqbroker --enable-proxy -c /home/rocketmq/broker.conf -pc /home/rocketmq/proxy.conf
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: namesrv:9876
      # 默认堆是 2g、直接内存 1g，这台机器撑不住
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m"
    ports:
      # 只对外发布 gRPC 端口，客户端一律走 18080
      - "18080:18080"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - ./rocketmq/proxy.conf:/home/rocketmq/proxy.conf:ro
      - ./rocketmq/init-topics.sh:/home/rocketmq/init-topics.sh:ro
    depends_on:
      - namesrv
    healthcheck:
      test: ["CMD-SHELL", "/home/rocketmq/rocketmq-5.3.2/bin/mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: feed-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 凭据除了写在 config.yaml 里，也可以在这里注入：配置里留空时用它兜底
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      RAM_ACCESS_KEY_ID: ${RAM_ACCESS_KEY_ID:-}
      RAM_ACCESS_KEY_SECRET: ${RAM_ACCESS_KEY_SECRET:-}
    ports:
      - "8081:8081"
    volumes:
      # 配置的唯一来源：宿主机上的这一份，只读挂载，不进镜像
      - ./back/config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      # /healthz 是不需要鉴权的存活探测接口
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: feed-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "81:81"
    depends_on:
      # 等后端真的能提供服务再起 nginx，避免刚启动那几秒 502
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
