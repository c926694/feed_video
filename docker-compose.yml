services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    command:
      - --port=3307
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: feed_video
      TZ: Asia/Shanghai
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -p1234 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  namesrv:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
      # 启动脚本用 HEAP_OPTS 覆盖默认堆，默认值是 1g，小内存机器必须压下来
      HEAP_OPTS: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "9876:9876"

  broker:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    # ProxyStartup 的 local 模式：同一个进程里同时提供 remoting 与 gRPC 两种端口
    command: sh mqbroker --enable-proxy -c /home/rocketmq/broker.conf -pc /home/rocketmq/proxy.conf
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: namesrv:9876
      # 默认堆是 2g、直接内存 1g，这台机器撑不住
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m"
    ports:
      # 10911 是 remoting 端口，18080 是 gRPC 端口；容器内外都用 18080，
      # 这样 Proxy 通告给客户端的地址和客户端实际连接的地址一致
      - "10911:10911"
      - "18080:18080"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - ./rocketmq/proxy.conf:/home/rocketmq/proxy.conf:ro
      - ./rocketmq/init-topics.sh:/home/rocketmq/init-topics.sh:ro
    depends_on:
      - namesrv
    healthcheck:
      test: ["CMD-SHELL", "/home/rocketmq/rocketmq-5.3.2/bin/mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # OSS 凭据由宿主机环境注入，不要写进仓库
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    ports:
      - "8081:8081"
    volumes:
      - ./back/config/config.compose.example.yaml:/app/config/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "81:81"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
